[workspace]
resolver = "2"
members = ["prover", "verifier"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# TLSNotary
tlsn = { git = "https://github.com/tlsnotary/tlsn", branch = "main" }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn", branch = "main" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# HTTP
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# TLS
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false }
rustls-pemfile = "2"
webpki-roots = "0.26"

# Crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Utilities
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
